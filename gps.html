<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>GPS Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000000;
      color: #ffffff;
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 18px;
      padding: 16px;
      min-height: 100dvh;
    }

    h1 {
      font-size: 16px;
      color: #aaaaaa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .row {
      margin-bottom: 14px;
      padding: 10px 12px;
      background: #111118;
      border-radius: 6px;
      border: 1px solid #1e1e2a;
    }

    .row-label {
      font-size: 12px;
      color: #555566;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .row-value {
      font-size: 20px;
      color: #ffffff;
      font-weight: 600;
    }

    .row-value.ok    { color: #88cc44; }
    .row-value.warn  { color: #ffee44; }
    .row-value.error { color: #ff5555; }
    .row-value.muted { color: #888888; }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: #1a1a2a;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: #aaaaff;
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 18px;
      cursor: pointer;
      text-align: center;
    }

    .btn:active { background: #2a2a4a; }
    .btn.secondary { color: #888888; border-color: #2a2a2a; margin-top: 8px; }

    .source-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
      vertical-align: middle;
      font-weight: 400;
    }
    .badge-gps    { background: #1a3a1a; color: #88cc44; }
    .badge-server { background: #1a1a3a; color: #8888ff; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #333;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>📍 GPS Test</h1>

<div class="row">
  <div class="row-label">Fuente</div>
  <div class="row-value" id="fuente">—</div>
</div>

<div class="row">
  <div class="row-label">Estado</div>
  <div class="row-value" id="estado">Iniciando…</div>
</div>

<div class="row">
  <div class="row-label">Lugar</div>
  <div class="row-value" id="lugar">—</div>
</div>

<div class="row">
  <div class="row-label">Latitud</div>
  <div class="row-value" id="lat">—</div>
</div>

<div class="row">
  <div class="row-label">Longitud</div>
  <div class="row-value" id="lon">—</div>
</div>

<div class="row">
  <div class="row-label">Precisión</div>
  <div class="row-value" id="prec">—</div>
</div>

<div class="row">
  <div class="row-label">Última actualización</div>
  <div class="row-value" id="updated">—</div>
</div>

<button class="btn" id="btn-gps" onclick="obtenerGPS()">📍 Actualizar con GPS</button>
<button class="btn secondary" id="btn-server" onclick="consultarServidor()">☁️ Ver última guardada</button>

<script>
  function set(id, val, cls) {
    const el = document.getElementById(id);
    el.textContent = val;
    el.className = 'row-value' + (cls ? ' ' + cls : '');
  }

  function toGDM(decimal, posDir, negDir) {
    const dir = decimal >= 0 ? posDir : negDir;
    const abs = Math.abs(decimal);
    const deg = Math.floor(abs);
    const min = ((abs - deg) * 60).toFixed(3);
    return deg + '° ' + min + "' " + dir;
  }

  function formatUpdated(iso) {
    if (!iso) return 'nunca';
    const d = new Date(iso);
    return d.toLocaleString('es-ES', { timeZone: 'Europe/Madrid',
      day: '2-digit', month: '2-digit',
      hour: '2-digit', minute: '2-digit' });
  }

  function formatLugar(data) {
    if (!data.barrio && !data.ciudad) return 'Desconocido';
    if (data.barrio && data.ciudad) return `${data.barrio}, ${data.ciudad}`;
    return data.ciudad || data.barrio;
  }

  function showData(data, source) {
    const srcLabel = source === 'gps'
      ? '<span class="source-badge badge-gps">GPS</span>'
      : '<span class="source-badge badge-server">servidor</span>';

    set('fuente', source === 'gps' ? '📱 Este dispositivo' : '☁️ Último guardado', source === 'gps' ? 'ok' : 'muted');
    set('estado', '✓ OK', 'ok');
    set('lugar',  formatLugar(data), 'ok');
    set('lat',    toGDM(data.lat, 'N', 'S'), 'ok');
    set('lon',    toGDM(data.lon, 'E', 'O'), 'ok');
    set('prec',   data.precision ? data.precision + ' m' : '—', data.precision && data.precision < 100 ? 'ok' : 'warn');
    set('updated', formatUpdated(data.updated));
  }

  // Read last saved location from server
  async function consultarServidor() {
    set('estado', '⏳ Consultando servidor…', 'warn');
    try {
      const r = await fetch('/api/geo');
      const d = await r.json();
      if (d.error) { set('estado', 'Error del servidor', 'error'); return; }
      showData(d, 'server');
    } catch {
      set('estado', 'Sin conexión', 'error');
    }
  }

  // Get GPS and save to server (iPhone only)
  function obtenerGPS() {
    if (!navigator.geolocation) {
      // Device can't get GPS → just read from server
      consultarServidor();
      return;
    }

    set('estado', '⏳ Buscando GPS…', 'warn');
    document.getElementById('btn-gps').innerHTML = '<span class="spinner"></span> Buscando…';

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const latRaw  = pos.coords.latitude;
        const lonRaw  = pos.coords.longitude;
        const precRaw = Math.round(pos.coords.accuracy);

        set('estado', '⏳ Guardando…', 'warn');
        document.getElementById('btn-gps').textContent = '📍 Actualizar con GPS';

        try {
          const r = await fetch(`/api/geo?lat=${latRaw}&lon=${lonRaw}&precision=${precRaw}`);
          const d = await r.json();
          if (d.error) { set('estado', 'Error guardando', 'error'); return; }
          showData(d, 'gps');
        } catch {
          set('estado', 'Error de red', 'error');
        }
      },
      (err) => {
        document.getElementById('btn-gps').textContent = '📍 Actualizar con GPS';
        if (err.code === 1) {
          // Permission denied → fall back to server
          consultarServidor();
        } else {
          set('estado', 'GPS no disponible', 'error');
        }
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
    );
  }

  // On load: try GPS first, fallback to server automatically
  obtenerGPS();
</script>
</body>
</html>
