<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>GPS Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000000;
      color: #ffffff;
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 18px;
      padding: 16px;
      min-height: 100dvh;
    }

    h1 {
      font-size: 16px;
      color: #aaaaaa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .row {
      margin-bottom: 14px;
      padding: 10px 12px;
      background: #111118;
      border-radius: 6px;
      border: 1px solid #1e1e2a;
    }

    .row-label {
      font-size: 12px;
      color: #555566;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .row-value {
      font-size: 20px;
      color: #ffffff;
      font-weight: 600;
    }

    .row-value.ok    { color: #88cc44; }
    .row-value.warn  { color: #ffee44; }
    .row-value.error { color: #ff5555; }

    #btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #1a1a2a;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: #aaaaff;
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 18px;
      cursor: pointer;
      text-align: center;
    }

    #btn:active { background: #2a2a4a; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #333;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>📍 GPS Test</h1>

<div class="row">
  <div class="row-label">Estado</div>
  <div class="row-value" id="estado">Esperando…</div>
</div>

<div class="row">
  <div class="row-label">Latitud</div>
  <div class="row-value" id="lat">—</div>
</div>

<div class="row">
  <div class="row-label">Longitud</div>
  <div class="row-value" id="lon">—</div>
</div>

<div class="row">
  <div class="row-label">Precisión</div>
  <div class="row-value" id="prec">—</div>
</div>

<div class="row">
  <div class="row-label">Lugar aproximado</div>
  <div class="row-value" id="lugar">—</div>
</div>

<div class="row">
  <div class="row-label">Hora de lectura</div>
  <div class="row-value" id="hora">—</div>
</div>

<button id="btn" onclick="obtenerGPS()">↻ Obtener ubicación</button>

<script>
  function set(id, val, cls) {
    const el = document.getElementById(id);
    el.textContent = val;
    el.className = 'row-value' + (cls ? ' ' + cls : '');
  }

  function toGDM(decimal, posDir, negDir) {
    const dir = decimal >= 0 ? posDir : negDir;
    const abs = Math.abs(decimal);
    const deg = Math.floor(abs);
    const min = ((abs - deg) * 60).toFixed(3);
    return deg + '° ' + min + "' " + dir;
  }

  async function reverseGeocode(lat, lon) {
    try {
      // Use our own Vercel endpoint to avoid CORS issues
      const r = await fetch(`/api/geo?lat=${lat}&lon=${lon}`);
      const d = await r.json();
      if (d.error) return '(error)';
      return d.lugar + (d.pais ? ', ' + d.pais : '');
    } catch {
      return '(sin conexión)';
    }
  }

  function obtenerGPS() {
    if (!navigator.geolocation) {
      set('estado', 'No soportado', 'error');
      return;
    }

    set('estado', '⏳ Buscando…', 'warn');
    document.getElementById('btn').innerHTML = '<span class="spinner"></span> Buscando…';

    // Options: try high accuracy first, fallback handled by browser
    const options = {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 30000, // accept cached position up to 30s old — helps on Watch
    };

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const latRaw = pos.coords.latitude;
        const lonRaw = pos.coords.longitude;
        const prec   = Math.round(pos.coords.accuracy);
        const hora   = new Date().toLocaleTimeString('es-ES', { timeZone: 'Europe/Madrid' });

        set('estado', '✓ OK', 'ok');
        set('lat',    toGDM(latRaw, 'N', 'S'), 'ok');
        set('lon',    toGDM(lonRaw, 'E', 'O'), 'ok');
        set('prec',   prec + ' m', prec < 100 ? 'ok' : 'warn');
        set('hora',   hora);
        set('lugar',  '…buscando…');

        document.getElementById('btn').textContent = '↻ Actualizar';

        const lugar = await reverseGeocode(latRaw, lonRaw);
        set('lugar', lugar, 'ok');
      },
      (err) => {
        const msgs = {
          1: 'Permiso denegado — activá ubicación en Ajustes → Safari',
          2: 'Posición no disponible',
          3: 'Tiempo agotado',
        };
        set('estado', msgs[err.code] || 'Error desconocido', 'error');
        document.getElementById('btn').textContent = '↻ Reintentar';
      },
      options
    );
  }

  // Auto-start on load
  obtenerGPS();
</script>
</body>
</html>
