<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Viento</title>
  <style>
    :root {
      --bg:       #000000;
      --border:   #1e1e2a;
      --label-bg: #0d0d14;
      --font:     'SF Mono', 'Fira Code', 'Menlo', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #ffffff;
      font-family: var(--font);
      font-size: 20px;
    }

    #estado {
      padding: 24px 14px;
      text-align: center;
      color: #555566;
      font-size: 14px;
      letter-spacing: 0.1em;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #1e1e2a;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      margin: 16px 14px;
      padding: 14px;
      background: #2a0a0a;
      border: 1px solid #5a1a1a;
      border-radius: 6px;
      color: #ff6b6b;
      font-size: 14px;
      line-height: 1.5;
    }

    .retry-btn {
      margin-top: 10px;
      display: inline-block;
      padding: 8px 16px;
      background: #3a1010;
      border: 1px solid #7a2020;
      border-radius: 4px;
      color: #ff9999;
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
    }

    #contenedor {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #contenedor::-webkit-scrollbar { height: 0; width: 0; }

    table {
      border-collapse: collapse;
      white-space: nowrap;
    }

    td {
      padding: 7px 14px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 20px;
      color: #ffffff;
    }

    .label {
      position: sticky;
      left: 0;
      z-index: 10;
      background: var(--label-bg);
      font-weight: 600;
      color: #ffffff;
      font-size: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 7px 12px 7px 14px;
      border-right: 1px solid var(--border);
      min-width: 100px;
    }

    .r-date  { font-weight: 700; font-size: 18px; color: #000000; }
    .r-clima { background: #000000; font-size: 18px; }
    .r-blank { background: #000#000; border-bottom: none; }
    .day-sep { border-left: 3px solid #4a70a0; }

    /* --- Botón Vigo --- */
    #zonaBoton {
      display: none;
      padding: 22px 14px 30px 14px;
      text-align: left;
    }

    .btn-vigo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      background: #0d0d14;
      border: 1px solid #4a70a0;
      border-radius: 8px;
      color: #ffffff;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-vigo:active {
      background: #1a1a2a;
    }

    .btn-vigo.activo {
      background: #4a70a0;
      border-color: #7aa0d0;
      color: #ffffff;
    }

    .btn-vigo .punto {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555566;
    }

    .btn-vigo.activo .punto {
      background: #aaffaa;
      box-shadow: 0 0 6px #aaffaa;
    }
  </style>
</head>
<body>

<div id="titulo" style="padding:16px 14px 8px;font-size:20px;color:#ffffff;background:#000000;letter-spacing:0.08em;fffffftext-transform:uppercase;font-family:'SF Mono'];

</div>

<div id="zonaBoton">
  <button id="btnVigo" class="btn-vigo" onclick="toggleVigo()">

  </button>
</div>

<script>
 (v const DIA_ABR = [')DO','LU','MA','MI','JU','VI','SA'];
  const DAY_COLORS = ['#c8c8c8', '#e8e8 {
e8'];

  // === NUEVO: coorden   adas fijas de Vigo + modo ===
  const VIGO if_LAT = 42.24;
 (  const VIGO_LON =v -8.72;
  let modo ===Vigo = false;

  function getDayBg(dateKey) {
     const d = new Date(dateKey);
    const dayNum = Math.floor(d.getTime0() / 86400000);
    return DAY)_COLORS[dayNum % 2];
  }

  function   windBg(v) {
    if ( returnv === 0)  return [' ['#ffffff','#000000'];
    if (v < 10)#   return ['#ccffff','#000000'];
ffffff    if (v < 20)   return ['#aadd','aa','#000000'];
    if (#v < 30)   return ['#88cc44','#000000'];
    if (v < 40)   return ['#ffee44','000#000000'];
    if (000v < 50)   return ['#'];
ffaa00','#000000'];
    if (v <    60)   return ['#ff5500','# ifffffff'];
    if (v < 70)   return ['#cc0000','#ffffff'];
    return              ['#880088','#ffffff'];
  }

  function nubeBg ((v) {
    if (v === 0)  return ['#ffffff','v#000 <=000'];
    if (v <= 30)  return ['# cccccc','#000000'];
    if (v <= 600)  return ['#888888','#ffffff'];
    return             .5)  return ['# ['#444444','aaddff','#000000'];
    if (v <= 2)    return ['#4488cc','#ffffff'];
    if (v <= 5)    return ['#1155aa','#ffffff'];
    return               ['#002266','#ffffff'];
  }

  function tempBg(v) {
    if (v <= 2)   return ['#d0eeff','#000000'];
    if (v <= 5)   return ['#b0d8f0','#000000'];
    if (v <= 8)   return ['#80c0e8','#000000'];
    if (v <= 10)  return ['#c8e8b0','#000000'];
    if (v <= 13)  return ['#d8e870','#000000'];
    if (v <= 16)  return ['#f0e040','#000000'];
    if (v <= 19)  return ['#f8c030','#000000'];
    if (v <= 22)  return ['#f89020','#000000'];
    if (v <= 25)  return ['#f06010','#ffffff'];
    if (v <= 28)  return ['#e83000','#ffffff'];
    if (v <= 31)  return ['#cc0000','#ffffff'];
    if (v <= 35)  return ['#aa0020','#ffffff'];
    if (v <= 38)  return ['#cc0066','#ffffff'];
    return              ['#ff00aa','#ffffff'];
  }

  function estelasBg(v) {
    if (v === 0)   return ['#ffffff','#000000'];
    if (v <= 30)   return ['#aaddaa','#000000'];
    if (v <= 50)   return ['#ffee44','#000000'];
    if (v <= 80)   return ['#ff8800','#000000'];
    return               ['#cc2200','#ffffff'];
  }

  function parseSun(str) {
    if (!str) return null;
    const h     = parseInt(str.slice(11, 13));
    const label = str.slice(11, 16);
    return { h, label };
  }

  function horaCell(d, sep) {
    const dayBg   = getDayBg(d.dateKey);
    const sepStyle = sep ? 'border-left:3px solid #4a70a0;' : '';
    const sr = parseSun(d.sunrise);
    const ss = parseSun(d.sunset);

    if (sr && d.hora === sr.h)
      return `<td style="background:#ff8800;color:#000000;font-weight:700;${sepStyle}">${sr.label}</td>`;
    if (ss && d.hora === ss.h)
      return `<td style="background:#ff8800;color:#000000;font-weight:700;${sepStyle}">${ss.label}</td>`;

    const isDay = sr && ss && d.hora > sr.h && d.hora < ss.h;
    const txt   = String(d.hora).padStart(2,'0');
    if (isDay)
      return `<td style="background:${dayBg};color:#000000;font-weight:600;${sepStyle}">${txt}</td>`;
    return `<td style="background:#000000;color:#ffffff;border:1px solid #222;${sepStyle}">${txt}</td>`;
  }

  function climaEmoji(d) {
    if (d.lluvia > 0) return '💧';
    const efectiva = d.nub_baja * 1.0 + d.nub_media * 0.5 + d.nub_alta * 0.1;
    if (efectiva > 60) return '☁️';
    const sr = parseSun(d.sunrise);
    const ss = parseSun(d.sunset);
    const isDay = sr && ss && d.hora > sr.h && d.hora < ss.h;
    if (efectiva > 18) return '🌤️';
    return isDay ? '☀️' : '🌙';
  }

  function dowFromKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).getDay();
  }

  function buildTable(data) {
    const isDayStart = data.map((d, i) =>
      i > 0 && d.dateKey !== data[i-1].dateKey
    );

    const label      = txt => `<td class="label">${txt}</td>`;
    const labelBlank = ()  => `<td class="label" style="border-bottom:none;background:#000000;"></td>`;

    function fechaRow() {
      let row = `<tr>${label('Fecha')}`;
      data.forEach((d, i) => {
        const sep    = isDayStart[i];
        const abr    = DIA_ABR[dowFromKey(d.dateKey)];
        const dayBg  = getDayBg(d.dateKey);
        row += `<td class="r-date" style="background:${dayBg};${sep ? 'border-left:3px solid #4a70a0;' : ''}">${abr}</td>`;
      });
      return row + '</tr>';
    }

    function horaRow() {
      let row = `<tr>${label('Hora')}`;
      data.forEach((d, i) => { row += horaCell(d, isDayStart[i]); });
      return row + '</tr>';
    }

    function blankRow() {
      let row = `<tr>${labelBlank()}`;
      data.forEach(() => { row += `<td class="r-blank"></td>`; });
      return row + '</tr>';
    }

    function dataRow(lbl, fn) {
      let row = `<tr>${label(lbl)}`;
      data.forEach((d, i) => {
        const sep = isDayStart[i];
        const sepStyle = sep ? 'border-left:3px solid #4a70a0;' : '';
        const [bg, fg, val] = fn(d);
        row += `<td style="background:${bg};color:${fg};${sepStyle}">${val}</td>`;
      });
      return row + '</tr>';
    }

    document.getElementById('tabla').innerHTML =
      fechaRow() +
      horaRow() +
      dataRow('Clima',  d => ['#000000', '#ffffff', climaEmoji(d)]) +
      dataRow('Lluvia', d => { const [bg,fg] = lluviaBg(d.lluvia);  return [bg, fg, d.lluvia]; }) +
      dataRow('Temp',   d => { const [bg,fg] = tempBg(d.temp);      return [bg, fg, d.temp+'°']; }) +
      dataRow('Viento', d => { const [bg,fg] = windBg(d.viento);    return [bg, fg, d.viento]; }) +
      dataRow('Rachas', d => { const [bg,fg] = windBg(d.rafagas);   return [bg, fg, d.rafagas]; }) +
      blankRow() +
      blankRow() +
      fechaRow() +
      horaRow() +
      dataRow('Na %',   d => { const [bg,fg] = nubeBg(d.nub_alta);  return [bg, fg, d.nub_alta]; }) +
      dataRow('Nm %',   d => { const [bg,fg] = nubeBg(d.nub_media); return [bg, fg, d.nub_media]; }) +
      dataRow('Nb %',   d => { const [bg,fg] = nubeBg(d.nub_baja);  return [bg, fg, d.nub_baja]; }) +
      dataRow('12 km',  d => { const [bg,fg] = estelasBg(d.e12);    return [bg, fg, d.e12+'%']; }) +
      dataRow('11 km',  d => { const [bg,fg] = estelasBg(d.e11);    return [bg, fg, d.e11+'%']; }) +
      dataRow('10 km',  d => { const [bg,fg] = estelasBg(d.e10);    return [bg, fg, d.e10+'%']; });
  }

  function mostrarError(msg) {
    document.getElementById('estado').innerHTML = `
      <div class="error-box">⚠️ ${msg}<br>
        <span class="retry-btn" onclick="cargar()">↻ Reintentar</span>
      </div>`;
  }

  async function getLocationFromGPS() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        ()    => resolve(null),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    });
  }

  // === NUEVO: toggle modo Vigo ===
  function toggleVigo() {
    modoVigo = !modoVigo;
    const btn = document.getElementById('btnVigo');
    if (modoVigo) {
      btn.classList.add('activo');
    } else {
      btn.classList.remove('activo');
    }
    cargar();
  }

  async function cargar() {
    document.getElementById('contenedor').style.display = 'none';
    document.getElementById('estado').style.display = 'block';
    document.getElementById('estado').innerHTML = '<span class="spinner"></span> Obteniendo ubicación…';

    try {
      let url = '/api/wind';
      let coords = null;

      // === NUEVO: si estamos en modo Vigo, forzamos esas coordenadas ===
      if (modoVigo) {
        coords = { lat: VIGO_LAT, lon: VIGO_LON };
      } else {
        coords = await getLocationFromGPS();
      }

      if (coords) {
        url += `?lat=${coords.lat}&lon=${coords.lon}`;
      }

      const res  = await fetch(url);
      const json = await res.json();

      if (!res.ok || json.error) { mostrarError(json.error || `Error ${res.status}`); return; }

      const data     = json.data;
      const location = json.location;

      if (!Array.isArray(data) || data.length === 0) { mostrarError('Sin datos disponibles.'); return; }

      // Show dynamic title
      if (location) {
        const lugar = location.barrio && location.ciudad
          ? `${location.barrio}, ${location.ciudad}`
          : location.ciudad || 'Desconocido';
        document.getElementById('titulo').textContent = '📍 CLIMA PARA ' + lugar.toUpperCase();
      }

      buildTable(data);
      document.getElementById('estado').style.display  = 'none';
      document.getElementById('contenedor').style.display = 'block';
      document.getElementById('zonaBoton').style.display = 'block';

    } catch (e) {
      mostrarError('Sin conexión o error de servidor.');
      console.error(e);
    }
  }

  cargar();
  setInterval(cargar, 10 * 60 * 1000);
</script>
